<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たびノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--ink:#1d2230;--ink2:#555a66;--line:#d4d2cc}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.9 'Shippori Mincho',serif;background:var(--paper)}
h1,h2,h3{font-weight:600;letter-spacing:.04em}
a{color:inherit}
header{display:flex;align-items:center;gap:14px;padding:14px 5vw;border-bottom:1px solid var(--ink);flex-wrap:wrap}
header .logo{font-size:24px;font-weight:600;letter-spacing:.12em;text-decoration:none;margin-right:auto}
header a,header button{font:inherit;font-size:15px}
main{max-width:920px;margin:0 auto;padding:24px 5vw 130px}
h2{font-size:22px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
button,.btn{font:inherit;cursor:pointer;color:var(--ink);background:none;border:1px solid var(--ink);padding:5px 16px;border-radius:0;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:34px 28px;margin-top:22px}
.card{display:block;text-decoration:none;border-top:1px solid var(--ink);padding-top:10px}
.card .ph{aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.card h3{margin:10px 0 0;font-size:18px;line-height:1.5}
.meta{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.empty{margin:50px 0;text-align:center;color:var(--ink2)}
label{display:block;margin:16px 0 4px;font-size:14px;color:var(--ink2)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 2px}
textarea{min-height:90px;border:1px solid var(--ink);padding:8px 10px}
input[type=file]{border:0;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ent{border:1px solid var(--line);padding:6px 14px 14px;margin:18px 0}
.hint{font-size:13px;color:var(--ink2);margin:4px 0}
.login{max-width:420px;margin:40px auto;text-align:center}
.hero{text-align:center;margin:10px 0 40px}
.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.4;margin:0 0 8px}
.facts{display:flex;gap:6px 22px;justify-content:center;flex-wrap:wrap;color:var(--ink2);font-size:15px}
.tl{position:relative;margin-top:30px}
.tl svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tl path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;opacity:.85}
.ev{position:relative;width:min(100%,560px);margin:0 0 56px;padding-top:6px}
.ev.r{margin-left:auto}
.ev .dot{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.ev.l .dot{left:-6px}.ev.r .dot{right:-6px}
.ev .t{font-size:18px;font-weight:600;margin:0 0 6px 22px}
.ev.r .t{margin:0 22px 6px 0;text-align:right}
.ev img{display:block;width:100%;border:1px solid var(--ink);mix-blend-mode:multiply}
.ev p{margin:12px 22px;white-space:pre-wrap}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
@media(max-width:560px){.row{grid-template-columns:1fr}.ev{width:88%}}
@media(prefers-reduced-motion:no-preference){.tl path{animation:draw 1.6s ease-out both}@keyframes draw{from{stroke-dasharray:3000;stroke-dashoffset:3000}to{stroke-dasharray:3000;stroke-dashoffset:0}}}
header{position:sticky;top:0;background:var(--paper);z-index:5}
#q{flex:1;min-width:0;border:1px solid var(--ink);padding:6px 12px}
#auth{margin-left:auto}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs a{text-align:center;padding:14px 4px;text-decoration:none;font-size:15px;border-top:3px solid transparent;margin-top:-1px}
#tabs a.on{font-weight:600;border-top-color:var(--ink)}
#fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:32px;line-height:1;text-decoration:none;z-index:6}
#fab[hidden],#q[hidden]{display:none}
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="記録を検索" aria-label="検索">
  <span id="auth"></span>
</header>
<main id="app"></main>
<a id="fab" href="#new" aria-label="新しい記録を書く" hidden>+</a>
<nav id="tabs">
  <a href="#discover" data-t="discover">みんなの記録</a>
  <a href="#home" data-t="home">My記録</a>
  <a href="#account" data-t="account">アカウント</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== 設定(anon key は公開してOK。service_role キーは絶対に入れない) =====
const SUPABASE_URL = 'https://hqbbgasivyggbkwxujmf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_F2DKoEpfjkOkIbittoGx7w_6l7m4eOF';
const APP_SALT = 'tabi-d4ae9287a97ddadbc98e3002'; // 試作版用。メール→パスワード生成に使用
// ==========================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
let user = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub = p => p ? sb.storage.from('photos').getPublicUrl(p).data.publicUrl : '';
const KIND = {trip:'旅行', hike:'登山'}, VIS = {private:'非公開', link:'URL限定', public:'全体公開'};

async function pw(email){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email.toLowerCase() + APP_SALT));
  return 'pw-' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
async function login(email){
  email = email.trim().toLowerCase();
  const password = await pw(email);
  let {error} = await sb.auth.signInWithPassword({email, password});
  if (error) {
    const r = await sb.auth.signUp({email, password});
    if (r.error) return alert('ログインできませんでした: ' + r.error.message);
    if (!r.data.session) return alert('Supabaseの Authentication > Providers > Email で「Confirm email」をオフにしてください。');
  }
  location.hash = '#home';
}
function renderAuth(){
  document.getElementById('auth').innerHTML = user ? '' : `<a class="btn" href="#login">ログイン</a>`;
}
sb.auth.onAuthStateChange((_e, s) => { user = s?.user ?? null; renderAuth(); route(); });

const card = r => {
  const img = r.cover_path ? `<img src="${esc(pub(r.cover_path))}" alt="" loading="lazy">` : '写真なし';
  const sub = r.kind === 'hike' ? [r.mountain, r.elevation && r.elevation + 'm'] : [r.place];
  return `<a class="card" href="#r/${r.id}"><div class="ph">${img}</div><h3>${esc(r.title)}</h3>
  <div class="meta">${esc(r.visit_date || '')} ${esc(sub.filter(Boolean).join(' '))}</div>
  <div class="meta">♥ ${r.favorites?.[0]?.count ?? 0}${r.profiles?.name ? '　' + esc(r.profiles.name) : ''}</div></a>`;
};
const SEL = '*, favorites(count), profiles(name)';

let q = '';
const qs = x => x.replace(/[,()%*\\_]/g, ' ').trim();
const withSearch = b => { const t = qs(q); return t ? b.or(`title.ilike.%${t}%,place.ilike.%${t}%,mountain.ilike.%${t}%`) : b; };
const listHtml = (data, empty) => data?.length ? `<div class="grid">${data.map(card).join('')}</div>` : `<div class="empty">${q.trim() ? '見つかりませんでした。' : empty}</div>`;

async function home(){
  if (!user) { app.innerHTML = `<div class="empty"><p style="font-size:20px">記録を書くにはログインが必要です</p><p><a class="btn" href="#login">ログイン</a></p></div>`; return; }
  const {data} = await withSearch(sb.from('records').select(SEL).eq('user_id', user.id)).order('created_at', {ascending:false});
  app.innerHTML = `<h2>My記録</h2>` + listHtml(data, 'まだ記録がありません。右下の + から最初の旅を書いてみましょう。');
}
function account(){
  if (!user) return loginView();
  app.innerHTML = `<h2>アカウント</h2><p>${esc(user.email)}</p><p><button id="out">ログアウト</button></p>`;
  document.getElementById('out').onclick = () => sb.auth.signOut();
}
async function discover(){
  const {data} = await withSearch(sb.from('records').select(SEL).eq('visibility','public')).order('created_at', {ascending:false}).limit(60);
  app.innerHTML = `<h2>みんなの記録</h2>` + listHtml(data, '公開された記録はまだありません。');
}
function loginView(){
  app.innerHTML = `<div class="login"><h2>メールアドレスでログイン</h2>
  <p class="hint">初めてのアドレスなら自動で登録されます。</p>
  <input id="em" type="email" placeholder="you@example.com" autocomplete="email">
  <p><button id="go">ログイン</button></p></div>`;
  const go = () => { const v = document.getElementById('em').value; if (v.includes('@')) login(v); };
  document.getElementById('go').onclick = go;
  document.getElementById('em').onkeydown = e => e.key === 'Enter' && go();
}

// 写真を縮小して再描画(位置情報などEXIFを取り除く)
function cleanImage(file){
  return new Promise((ok, ng) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? ok(b) : ng(new Error('変換失敗')); }, 'image/jpeg', .85);
    };
    im.onerror = () => ng(new Error('画像を読み込めません'));
    im.src = u;
  });
}

function newView(){
  if (!user) { location.hash = '#login'; return; }
  app.innerHTML = `<h2>新しい記録</h2>
  <label>種類</label><select id="kind"><option value="trip">旅行</option><option value="hike">登山</option></select>
  <label>タイトル</label><input id="title" maxlength="80">
  <div class="row"><div><label>日付</label><input id="date" type="date"></div><div><label id="plabel">旅行先</label><input id="place"></div></div>
  <div id="hikeF" hidden><div class="row"><div><label>標高(m)</label><input id="elev" type="number" min="0"></div><div><label>所要時間</label><input id="dur" placeholder="例: 5時間30分"></div></div>
  <label>登山コース</label><input id="course"></div>
  <h3 style="margin-top:30px">出来事</h3><div id="ents"></div>
  <button id="add" type="button">+ 出来事を追加</button>
  <label>公開範囲</label><select id="vis"><option value="private">非公開(自分だけ)</option><option value="link">URL限定</option><option value="public">全体公開(みんなの記録に載る)</option></select>
  <p class="hint">写真は保存前に位置情報を取り除きます。</p>
  <p><button id="save">保存する</button></p>`;
  const $ = id => document.getElementById(id);
  const addEnt = () => { const d = document.createElement('div'); d.className = 'ent';
    d.innerHTML = `<label>時刻</label><input class="tm" placeholder="例: 06:30">
    <label>写真</label><input class="ph" type="file" accept="image/*">
    <label>文章</label><textarea class="bd"></textarea><button type="button" class="rm">この出来事を削除</button>`;
    d.querySelector('.rm').onclick = () => d.remove(); $('ents').appendChild(d); };
  addEnt(); $('add').onclick = addEnt;
  $('kind').onchange = () => { const h = $('kind').value === 'hike'; $('hikeF').hidden = !h; $('plabel').textContent = h ? '山の名前' : '旅行先'; };
  $('save').onclick = async () => {
    if (!$('title').value.trim()) return alert('タイトルを入力してください');
    $('save').disabled = true; $('save').textContent = '保存中…';
    try {
      const h = $('kind').value === 'hike', rec = {kind:$('kind').value, title:$('title').value.trim(), visit_date:$('date').value || null,
        visibility:$('vis').value, place:h ? null : $('place').value, mountain:h ? $('place').value : null,
        elevation:h ? ($('elev').value || null) : null, duration:h ? $('dur').value : null, course:h ? $('course').value : null};
      const {data:r, error} = await sb.from('records').insert(rec).select().single(); if (error) throw error;
      const rows = []; let i = 0;
      for (const d of $('ents').children) {
        const f = d.querySelector('.ph').files[0]; let path = null;
        if (f) { path = `${user.id}/${crypto.randomUUID()}.jpg`;
          const {error:e} = await sb.storage.from('photos').upload(path, await cleanImage(f), {contentType:'image/jpeg'}); if (e) throw e; }
        rows.push({record_id:r.id, position:i++, time_label:d.querySelector('.tm').value, body:d.querySelector('.bd').value, photo_path:path});
      }
      if (rows.length) { const {error:e} = await sb.from('entries').insert(rows); if (e) throw e; }
      const cover = rows.find(x => x.photo_path)?.photo_path;
      if (cover) await sb.from('records').update({cover_path:cover}).eq('id', r.id);
      location.hash = '#r/' + r.id;
    } catch (e) { alert('保存できませんでした: ' + e.message); $('save').disabled = false; $('save').textContent = '保存する'; }
  };
}

function drawCurve(){
  const tl = document.querySelector('.tl'); if (!tl) return;
  const box = tl.getBoundingClientRect();
  const p = [...tl.querySelectorAll('.dot')].map(d => { const a = d.getBoundingClientRect(); return [a.left - box.left + a.width/2, a.top - box.top + a.height/2]; });
  if (p.length < 2) return;
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length; i++) { const [x0,y0] = p[i-1], [x1,y1] = p[i], m = (y1 - y0) * .55;
    d += ` C${x0},${y0 + m} ${x1},${y1 - m} ${x1},${y1}`; }
  tl.querySelector('svg').innerHTML = `<path d="${d}"/>`;
}

async function detail(id, token){
  let rec, ents, author;
  if (token) {
    const {data} = await sb.rpc('get_shared', {t:token}); if (!data) return app.innerHTML = '<div class="empty">この記録は見つかりません。</div>';
    rec = data.record; ents = data.entries; author = data.author;
  } else {
    const {data} = await sb.from('records').select('*, entries(*), profiles(name), favorites(count)').eq('id', id).maybeSingle();
    if (!data) return app.innerHTML = '<div class="empty">この記録は見つからないか、非公開です。</div>';
    rec = data; ents = [...data.entries].sort((a,b) => a.position - b.position); author = data.profiles?.name;
  }
  const mine = user && rec.user_id === user.id;
  const facts = [KIND[rec.kind], rec.visit_date, rec.place, rec.mountain, rec.elevation && rec.elevation + 'm', rec.course && 'コース: ' + rec.course, rec.duration && '所要 ' + rec.duration, author && '記録: ' + author];
  let fav = false;
  if (user && !token) { const {data} = await sb.from('favorites').select('record_id').eq('record_id', rec.id).eq('user_id', user.id); fav = !!data?.length; }
  const link = location.origin + location.pathname + '#s/' + rec.share_token;
  app.innerHTML = `<div class="hero"><h1>${esc(rec.title)}</h1><div class="facts">${facts.filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</div></div>
  <div class="tl"><svg aria-hidden="true"></svg>${ents.map((e,i) => `<div class="ev ${i % 2 ? 'r' : 'l'}"><span class="dot"></span>
    ${e.time_label ? `<div class="t">${esc(e.time_label)}</div>` : ''}${e.photo_path ? `<img src="${esc(pub(e.photo_path))}" alt="">` : ''}${e.body ? `<p>${esc(e.body)}</p>` : ''}</div>`).join('')}</div>
  <div class="bar">${user && !token ? `<button id="fav">${fav ? '♥ お気に入り済み' : '♡ お気に入り'}</button>` : ''}
  ${mine ? `<span class="hint" style="align-self:center">${VIS[rec.visibility]}</span><button id="cp">共有URLをコピー</button><button id="del">削除</button>` : ''}</div>
  ${mine && rec.visibility === 'private' ? '<p class="hint" style="text-align:center">共有URLは「URL限定」か「全体公開」のときだけ開けます。</p>' : ''}`;
  app.querySelectorAll('.ev img').forEach(im => im.onload = drawCurve);
  drawCurve();
  const $ = id => document.getElementById(id);
  if ($('fav')) $('fav').onclick = async () => { fav ? await sb.from('favorites').delete().eq('record_id', rec.id).eq('user_id', user.id) : await sb.from('favorites').insert({record_id:rec.id}); detail(id, token); };
  if ($('cp')) $('cp').onclick = () => navigator.clipboard.writeText(link).then(() => alert('コピーしました\n' + link));
  if ($('del')) $('del').onclick = async () => { if (!confirm('この記録を削除しますか?')) return;
    const paths = ents.map(e => e.photo_path).filter(Boolean); if (paths.length) await sb.storage.from('photos').remove(paths);
    await sb.from('records').delete().eq('id', rec.id); location.hash = '#home'; };
}
window.addEventListener('resize', drawCurve);

function route(){
  let h = location.hash.slice(1) || 'home';
  if (!/^(home|discover|account|login|new|r\/|s\/)/.test(h)) h = 'home';
  const list = h === 'home' || h === 'discover';
  const tab = (h === 'home' || h === 'new') ? 'home' : h === 'discover' ? 'discover' : (h === 'account' || h === 'login') ? 'account' : '';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  const qi = document.getElementById('q'); qi.hidden = !list;
  qi.placeholder = h === 'discover' ? 'みんなの記録を検索' : 'My記録を検索';
  document.getElementById('fab').hidden = h !== 'home';
  if (h === 'home') home(); else if (h === 'discover') discover(); else if (h === 'account') account(); else if (h === 'login') loginView();
  else if (h === 'new') newView(); else if (h.startsWith('r/')) detail(h.slice(2)); else detail(null, h.slice(2));
}
let qt; document.getElementById('q').oninput = e => { q = e.target.value; clearTimeout(qt); qt = setTimeout(route, 300); };
window.addEventListener('hashchange', route);
</script>
</body>
</html>
